{% extends "base.html" %}

{% block contenido %}
<h1 class="fw-bold mb-4">Nueva Tarea</h1>

<div class="col-md-6">
    {% with messages = get_flashed_messages(category_filter=["tarea"]) %}
        {% if messages %}
            {% for msg in messages %}
                <div class="alert alert-danger py-1">{{ msg }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form action="/tareas/crear" method="POST">
        <div class="mb-3">
            <label class="form-label">Título:</label>
            <input type="text" name="titulo" class="form-control border-dark">
        </div>
        <div class="mb-3">
            <label class="form-label">Categoría:</label>
            <select name="categoria_id" class="form-select border-dark">
                <option value="">Selecciona una categoría</option>
                {% for cat in categorias %}
                    <option value="{{ cat.id }}">{{ cat.nombre }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Prioridad:</label>
            <select name="prioridad" class="form-select border-dark">
                <option value="">Selecciona una prioridad</option>
                <option value="Baja">Baja</option>
                <option value="Media">Media</option>
                <option value="Alta">Alta</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Fecha límite:</label>
            <input type="date" name="fecha_limite" class="form-control border-dark">
        </div>
        <div class="mb-3">
            <label class="form-label">Descripción:</label>
            <textarea name="descripcion" rows="4" class="form-control border-dark"></textarea>
        </div>
        <button type="submit" class="btn btn-dark me-3">Guardar</button>
        <a href="/tareas" class="text-primary text-decoration-underline">Cancelar</a>
    </form>
</div>
{% endblock %}
