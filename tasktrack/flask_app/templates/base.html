<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    {% if session.get('usuario_id') %}
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 px-4">
        <a class="navbar-brand fw-bold fs-3" href="/tareas">☑ TaskTrack</a>
        <div class="collapse navbar-collapse ms-4">
            <ul class="navbar-nav me-auto">
                <li class="nav-item me-3"><a class="nav-link fs-5" href="/tareas">Mis Tareas</a></li>
                <li class="nav-item me-3"><a class="nav-link fs-5" href="/categorias">Categorías</a></li>
            </ul>
            <div class="dropdown">
                <a class="btn btn-dark dropdown-toggle fs-5" href="#" role="button" data-bs-toggle="dropdown">
                    Hola, {{ usuario.nombre }}
                </a>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li><a class="dropdown-item text-danger" href="/logout">Cerrar Sesión</a></li>
                </ul>
            </div>
        </div>
    </nav>
    {% endif %}

    <div class="container-fluid px-4">
        {% block contenido %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
