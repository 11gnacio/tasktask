{% extends "base.html" %}

{% block contenido %}
<h1 class="fw-bold mb-4">Nueva Categoría</h1>

<div class="col-md-6">
    {% with messages = get_flashed_messages(category_filter=["categoria"]) %}
        {% if messages %}
            {% for msg in messages %}
                <div class="alert alert-danger py-1">{{ msg }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form action="/categorias/crear" method="POST">
        <div class="mb-3">
            <label class="form-label">Nombre:</label>
            <input type="text" name="nombre" class="form-control border-dark">
        </div>
        <button type="submit" class="btn btn-dark me-3">Guardar</button>
        <a href="/categorias" class="text-primary text-decoration-underline">Cancelar</a>
    </form>
</div>
{% endblock %}
