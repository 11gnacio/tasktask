{% extends "base.html" %}

{% block contenido %}
<h1 class="fw-bold mb-4">Editar Tarea</h1>

<div class="col-md-6">
    {% with messages = get_flashed_messages(category_filter=["tarea"]) %}
        {% if messages %}
            {% for msg in messages %}
                <div class="alert alert-danger py-1">{{ msg }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form action="/tareas/actualizar/{{ tarea.id }}" method="POST">
        <div class="mb-3">
            <label class="form-label">Título:</label>
            <input type="text" name="titulo" value="{{ tarea.titulo }}" class="form-control border-dark">
        </div>
        <div class="mb-3">
            <label class="form-label">Categoría:</label>
            <select name="categoria_id" class="form-select border-dark">
                {% for cat in categorias %}
                    <option value="{{ cat.id }}" {% if cat.id == tarea.categoria_id %}selected{% endif %}>{{ cat.nombre }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Prioridad:</label>
            <select name="prioridad" class="form-select border-dark">
                <option value="Baja" {% if tarea.prioridad == 'Baja' %}selected{% endif %}>Baja</option>
                <option value="Media" {% if tarea.prioridad == 'Media' %}selected{% endif %}>Media</option>
                <option value="Alta" {% if tarea.prioridad == 'Alta' %}selected{% endif %}>Alta</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Fecha límite:</label>
            <input type="date" name="fecha_limite" value="{{ tarea.fecha_limite }}" class="form-control border-dark">
        </div>
        <div class="mb-3">
            <label class="form-label">Descripción:</label>
            <textarea name="descripcion" rows="4" class="form-control border-dark">{{ tarea.descripcion }}</textarea>
        </div>
        <button type="submit" class="btn btn-dark me-3">Actualizar</button>
        <a href="/tareas/{{ tarea.id }}" class="text-primary text-decoration-underline">Cancelar</a>
    </form>
</div>
{% endblock %}
