{% extends "base.html" %}

{% block contenido %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="fw-bold">Categorías</h1>
    <a href="/categorias/nueva" class="btn btn-primary">+ Nueva Categoría</a>
</div>

<table class="table table-bordered bg-white col-md-8">
    <thead class="table-secondary">
        <tr>
            <th>Nombre</th>
            <th>Cantidad de tareas</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody>
        {% for cat in categorias %}
        <tr>
            <td>{{ cat.nombre }}</td>
            <td>{{ cat.cantidad_tareas }}</td>
            <td>
                <a href="/categorias/borrar/{{ cat.id }}" class="text-danger text-decoration-underline" onclick="return confirm('¿Borrar categoría?')">Borrar</a>
            </td>
        </tr>
        {% else %}
        <tr>
            <td colspan="3" class="text-center">No hay categorías agregadas.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
